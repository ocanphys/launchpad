site_name: launchpad
docs_dir: docs
theme:
  name: readthedocs
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            filters: ["!^_"]
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js
  - path: js/mermaid-elk.js
    type: module
markdown_extensions:
  - tables
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
nav:
  - Overview: index.md
  - Framework: framework.md
  - Getting started: getting-started.md
  - Artifacts: artifacts.md
  - Manifests: manifests.md
  - Lab: lab.md
  - Training a Model: training.md
  - Models: models.md
  - Experiments: experiments.md
  - Jobs: jobs.md
  - Workers: workers.md
  - Launcher: launcher.md
  - Dashboard: dashboard.md
  - Logging: logging.md
  - Artifact Repository: repository.md
  - Profiling: profiling.md
  - Chat: chat.md

site_name: launchpad
docs_dir: docs
theme:
  name: readthedocs
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            filters: ["!^_"]
            show_root_toc_entry: false
            separate_signature: true
            docstring_options:
              warn_missing_types: false
              returns_multiple_items: false
extra_css:
  - css/mkdocstrings.css
extra_javascript:
  - js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js
  - path: js/mermaid-elk.js
    type: module
markdown_extensions:
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
nav:
  - Overview: index.md
  - Guides:
      - Framework: framework.md
      - Getting started: getting-started.md
      - Experiments: experiments.md
      - Repository: repository.md
  - artifacts:
      - How it fits together: core.md
      - Artifacts: artifacts.md
      - Jobs: jobs.md
      - Manifests: manifests.md
      - Repository:
            - Sources: artifact-repository/sources.md
            - Tokenizers: artifact-repository/tokenizers.md
            - Tokenized: artifact-repository/tokenized.md
            - Dataset: artifact-repository/dataset.md
            - Mapped dataset: artifact-repository/mappeddataset.md
            - Stages:
                  - Pretraining: artifact-repository/stages.md
                  - Evaluations: artifact-repository/stages/evaluations.md
                  - Samplers: artifact-repository/stages/samplers.md
  - models:
      - Models: models.md
      - Repository:
            - Transformer: model-repository/transformer.md
            - Transformer FA: model-repository/transformerFA.md
            - Mamba: model-repository/mamba.md
  - training:
      - Training a Model: training.md
      - Monitoring: monitoring.md
  - profiling:
      - Profiling: profiling.md
      - Attribution: profiling/attribution.md
  - system:
      - Workers: workers.md
      - Logging: logging.md
      - Launcher: launcher.md
      - Dashboard: dashboard.md
      - Chat: chat.md
      - Lab: lab.md

[project]
name = "launchpad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "ipykernel>=7.3.0",
    "modal>=1.5.4",
    "numpy>=2.4.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "regex>=2026.8.31",
    "ruff>=0.16.3",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "lab", "local", "main"]

[tool.setuptools.packages.find]
include = ["artifacts*", "models*", "system*"]

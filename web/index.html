<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artifacts</title>
<!-- Inline SVG, not a mounted file -- avoids both a GET /favicon.ico 404
     (browsers request that path automatically unless a <link rel="icon">
     says otherwise) and adding a static file just for this. Same dot motif
     as the status lights elsewhere on the page (see render.js's dot()). -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%230969da'/></svg>">
<!-- uPlot (vendored, v1.6.32) draws the training curves; the classic
     script defines the `uPlot` global artifactview.js uses. -->
<link rel="stylesheet" href="uPlot.min.css">
<script src="uPlot.iife.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  /* Two frames, one page: the route's own view above, this container's
     launcher log below, and a boundary that drags. The log's height is a
     variable app.js's splitter writes; a fifth of the window until someone
     drags it. Neither frame scrolls the other: the page scrolls inside #app. */
  html { height: 100%; }
  body {
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0; height: 100%; overflow: hidden;
    display: grid; grid-template-rows: minmax(0, 1fr) auto var(--log-height, 20vh);
  }
  #app { overflow: auto; min-height: 0; }
  #page { margin: 0 auto; padding: 2rem 1.5rem; max-width: 64rem; }
  body.dashboard-page #page { max-width: 108rem; }
  /* One artifact's page carries its own calls' log, so the container's would
     be a second stream under it: the bottom frame is the dashboard's, and
     the page takes the whole window everywhere else. */
  body:not(.dashboard-page) { grid-template-rows: minmax(0, 1fr); }
  body:not(.dashboard-page) #split,
  body:not(.dashboard-page) #launcherPanel { display: none; }
  #split {
    height: 7px; cursor: row-resize; touch-action: none;
    border-top: 1px solid rgba(128,128,128,.25);
    background: rgba(128,128,128,.1);
  }
  #split:hover { background: rgba(128,128,128,.25); }
  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .4rem; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; }

  /* Leaves the SPA entirely: a redirect to the lab's own subdomain. */
  #labLink { font-size: 12px; color: inherit; opacity: .55; text-decoration: none; }
  #labLink:hover { opacity: .85; }

  /* The one way the page asks the server again (app.js's refresh): green
     after a good answer, red with the error after a bad one. */
  #refresh {
    font: 11px/1.6 inherit; padding: .1rem .55rem; border: 1px solid; border-radius: 999px;
    white-space: nowrap; background: transparent; cursor: pointer; color: inherit; opacity: .7;
  }
  #refresh:disabled { cursor: default; }
  .ok  { color: #1a7f37; border-color: #1a7f37; }
  .bad { color: #cf222e; border-color: #cf222e; }
  #meta { opacity: .55; font-size: 11px; margin-bottom: 1rem; min-height: 1.2em; }

  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  /* Cell padding is all a row's height is above its one line of text, so it
     is what a denser table trades: .08rem puts a row at ~85% of what .2rem
     gave, with the text itself untouched. */
  th, td { padding: .08rem .7rem; text-align: left; border-top: 1px solid rgba(128,128,128,.18); }
  th { opacity: .55; font-weight: 600; font-size: 11px; border-top: none; }
  td.run { word-break: break-all; }
  /* Like the path column: one line, ellipsis, the whole of it on hover, so a
     long payload never grows the row taller than every other row. */
  td.progress { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dim { opacity: .45; }

  /* One dot per artifact row -- see dot() in render.js for what puts an
     artifact into each bucket.
       done     : finished.
       running  : an active call is working on it right now.
       starting : waiting for its first heartbeat within the startup grace.
       runnable : nothing blocking it, no call in progress -- can launch.
       blocked  : not done, not runnable (waiting on a dependency).
       failed   : a call held the lease and went stale or never beat, or the
                  manifest itself conflicts with what's declared. */
  .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 999px; vertical-align: middle; margin-right: .4rem; }
  .dot.done     { background: #1a7f37; }
  .dot.running,
  .dot.starting { background: #0969da; }
  .dot.runnable { background: #bf8700; }
  .dot.blocked  { background: rgba(128,128,128,.4); }
  .dot.failed   { background: #cf222e; }

  /* The first (artifact/type) column never wraps -- a wrapped row grows
     taller and throws off every row's vertical rhythm. */
  tr.artifact-row td:first-child {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .artifact-type { font-size: 11px; }
  /* "(Mapped)" next to a MappedDataSet's type. Dim like every other
     secondary label on the page, not a badge -- a note, not a status. */
  .artifact-tag { opacity: .5; font-size: 11px; }
  /* Long paths truncate with an ellipsis instead of wrapping to a second
     line -- a wrapped row grows taller and throws off every row's
     vertical rhythm. Full path is still one hover away via the link's
     title attribute. */
  td.artifact-path {
    opacity: .7; font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* One button per row, offering the one thing worth doing to that artifact
     (render.js's actionButton): run it, or stop it. One shape and one slot
     for both -- only the color says which, matching the dot palette above:
     green for run, red for stop. */
  .launch-btn {
    min-width: 2.6rem; padding: .1rem .3rem;
    font: 9px/1 inherit; text-align: center; vertical-align: middle;
    border: 1px solid; border-radius: 3px;
    background: transparent;
    cursor: pointer;
  }
  .launch-btn.run      { border-color: #1a7f37; color: #1a7f37; }
  .launch-btn.cancel   { border-color: #cf222e; color: #cf222e; }
  .launch-btn.run:hover:not(:disabled)      { background: rgba(26,127,55,.15); }
  .launch-btn.cancel:hover:not(:disabled)   { background: rgba(207,34,46,.15); }
  /* Nothing to do (already done): pale and frozen -- no color, no hover,
     no pointer. Still shown so its slot in the row doesn't shift once it
     does become launchable. */
  .launch-btn:disabled {
    border-color: rgba(128,128,128,.3); color: rgba(128,128,128,.5);
    cursor: default;
  }
  /* A pending request or a call waiting for its first heartbeat stays blue,
     matching the starting/running dot, even though the button is disabled. */
  .launch-btn.clicked:disabled,
  .launch-btn.starting:disabled {
    border-color: #0969da; color: #0969da;
  }

  .empty { opacity: .55; padding: 1rem 0; }

  details#problems { margin-top: 1.5rem; }
  details#problems summary {
    cursor: pointer; font-size: 11px; font-weight: 600; color: #cf222e;
  }
  details#problems table { margin-top: .6rem; table-layout: fixed; }
  details#problems td.run { width: 30%; }
  td.error { word-break: break-word; white-space: pre-wrap; opacity: .85; font-size: 11px; }

  a.artifact-link { color: inherit; text-decoration: none; }
  a.artifact-link:hover { text-decoration: underline; }

  /* The table takes the whole width of the page frame now that the launcher
     log has a frame of its own below it. */
  .dashboard-artifacts { min-width: 0; overflow-x: auto; }
  /* Four columns now: the three fixed ones plus room for progress before the
     frame scrolls sideways instead of squeezing them. */
  .dashboard-artifacts > table { min-width: 54rem; }
  #launcherPanel {
    padding: .35rem .75rem .4rem; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
  }
  #launcherLogs { overflow: auto; min-height: 0; }
  #launcherLogStatus { opacity: .55; font-size: 11px; padding-top: .3rem; }

  /* --- one artifact's page --------------------------------------------- */
  #artifactView { font-size: 12px; }
  .view-back a { color: inherit; opacity: .6; text-decoration: none; }
  .view-back a:hover { opacity: 1; text-decoration: underline; }

  /* An artifact's drill-down page (see artifactview.js): type, own
     parameters, and links one level down to whatever it depends on. */
  .artifact-summary {
    border: 1px solid rgba(128,128,128,.18); border-radius: 6px;
    padding: .6rem .9rem; margin: .3rem 0 1rem;
  }
  .summary-type { font-weight: 600; font-size: 12px; margin-bottom: .3rem; }
  .summary-params { display: flex; flex-direction: column; gap: .1rem; }
  .summary-param { display: flex; gap: .5rem; font-size: 11px; align-items: baseline; }
  .summary-key { opacity: .55; min-width: 8rem; }
  .summary-value { word-break: break-word; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .summary-deps { font-size: 11px; opacity: .8; margin: .5rem 0 0; word-break: break-all; }
  .summary-deps a { color: inherit; }
  .summary-deps a:hover { text-decoration: underline; }

  /* Shared log rendering (logview.js): filters and labelled columns over one
     line per record, in the artifact stream and the launcher panel alike. */
  .artifact-logs { margin-top: 1rem; }
  .log-heading { display: flex; flex-wrap: wrap; align-items: baseline; }
  /* A checkbox in a section heading: log levels, expanded parameters. */
  .log-filter { font-weight: 400; font-size: 11px; margin-left: .8rem; cursor: pointer; }
  .log-filter input { vertical-align: -1px; margin-right: .25rem; }
  .log-lines {
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: .4rem .5rem;
    background: rgba(128,128,128,.06); border-radius: 4px;
  }
  /* One grid per line with fixed columns, so every line's cells sit under
     the previous line's: widths in ch, exact in the monospace font above
     (DD/MM/YY-HH:mm:ss, an 8-char call id, "heartbeat", "CRITICAL"). */
  .log-line {
    display: grid; grid-template-columns: 17ch 8ch 9ch 8ch 1fr;
    column-gap: 1ch; align-items: baseline; padding: .15rem 0;
  }
  .log-line + .log-line { border-top: 1px solid rgba(128,128,128,.15); }
  .log-ts { opacity: .55; }
  .log-call { opacity: .7; }
  .log-source { opacity: .7; }
  .log-level { font-weight: 600; }
  .log-msg { white-space: pre-wrap; word-break: break-word; }
  /* The column labels, in the same grid as the lines so each sits over its
     column. */
  .log-columns span { opacity: .45; font-weight: 400; }
  /* The side panel is dense and narrow: one line per record still, with the
     date dropped from the time (app.js's `compactTime`) to leave the message
     room. Its labels are pinned to the top of the panel's scroll area, and
     have to be opaque or the lines would scroll through them: the page's own
     background, under the same tint `.log-lines` lays over it. */
  .launcher-logs .log-lines { font-size: 10px; line-height: 1.3; padding: .2rem .4rem; }
  .launcher-logs .log-line { grid-template-columns: 8ch 8ch 8ch 8ch minmax(0, 1fr); padding: .04rem 0; }
  .launcher-logs .log-columns {
    position: sticky; top: 0; z-index: 1;
    background: linear-gradient(rgba(128,128,128,.06), rgba(128,128,128,.06)), Canvas;
  }
  .launcher-logs .log-line + .log-line { border-top-color: rgba(128,128,128,.08); }
  /* Level and message take the level's color; time, call and source stay muted.
     INFO is the page's own text color (white on dark, black on light). */
  .level-DEBUG    .log-level, .level-DEBUG    .log-msg { color: #8b949e; }
  .level-WARNING  .log-level, .level-WARNING  .log-msg { color: #d4a72c; }
  .level-ERROR    .log-level, .level-ERROR    .log-msg { color: #e8710a; }
  .level-CRITICAL .log-level, .level-CRITICAL .log-msg { color: #cf222e; }

  /* A leg's training curves (see artifactview.js's curvesSection()): one
     uPlot chart per metric, one line per attempt. uPlot's own title and
     legend are restyled to the page's type. */
  .artifact-curves { margin-top: 1rem; }
  .curve-row { display: flex; flex-wrap: wrap; gap: .6rem; }
  .curve { border: 1px solid rgba(128,128,128,.18); border-radius: 6px; padding: .4rem .6rem; }
  .curve .u-title { font-family: inherit; font-size: 11px; font-weight: 600; opacity: .7; text-align: left; }
  .curve .u-legend { font-family: inherit; font-size: 11px; text-align: left; }
  .curve .u-legend .u-marker { border-radius: 999px; }

</style>
</head>
<body>

<!-- The top frame: everything the route switches between, scrolling on its
     own so the launcher log below stays put. -->
<div id="app">
<div id="page">

<header>
  <h1 id="title">artifacts</h1>
  <a id="labLink" href="/lab" target="_blank" rel="noopener">lab ↗</a>
  <button id="refresh" type="button" disabled>loading…</button>
</header>
<div id="meta"></div>

<div id="dashboard">
<div class="dashboard-artifacts">
<table>
  <!-- Progress is the one column with no width of its own, so it takes
       whatever the others leave: it is the one that gets long. The call and
       its last heartbeat are the artifact label's hover (render.js's
       callSummary), not columns. -->
  <colgroup>
    <col style="width: 13.5rem">
    <col style="width: 26rem">
    <col>
    <col style="width: 5.5rem">
  </colgroup>
  <thead>
    <tr><th>artifact</th><th>path</th><th>progress</th><th></th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<p class="empty" id="empty" hidden></p>

<!-- Only a manifest state() could not read lands here. Hidden entirely
     when there are none; collapsed by default when there are, since these
     are the exception, not what a glance at the page is usually for. -->
<details id="problems" hidden>
  <summary>unreadable manifests (<span id="problemCount">0</span>)</summary>
  <table>
    <thead>
      <tr><th>path</th><th>error</th></tr>
    </thead>
    <tbody id="problemRows"></tbody>
  </table>
</details>
</div>
</div>

<!-- One artifact's own page, routed to by #/artifact/<path> -- see app.js's
     route() and artifactview.js. Hidden and empty until a route into it
     fires; #dashboard above is hidden in exchange. -->
<div id="artifactView" hidden></div>

</div>
</div>

<!-- The boundary between the two frames: dragging it writes --log-height,
     which is the row the panel below sits in (app.js's splitter). -->
<div id="split" role="separator" aria-orientation="horizontal" aria-label="resize launcher logs"></div>

<!-- The bottom frame, on every route: what this leasebook container has
     logged, its own doings and what it did to the calls it manages. -->
<aside id="launcherPanel" aria-label="launcher logs">
  <div id="launcherLogs"></div>
  <div id="launcherLogStatus">updates every 2s</div>
</aside>

<!-- One entry point. type="module" gives us import/export with no bundler.
     Note: ES modules only load over http(s), not file:// — serve the folder
     (which your orchestrator already does, since the page fetches /state). -->
<script type="module" src="app.js"></script>

</body>
</html>

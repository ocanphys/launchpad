<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runs</title>
<!-- Inline SVG, not a mounted file -- avoids both a GET /favicon.ico 404
     (browsers request that path automatically unless a <link rel="icon">
     says otherwise) and adding a static file just for this. Same dot motif
     as the status lights elsewhere on the page (see render.js's dot()). -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%230969da'/></svg>">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0 auto; padding: 2rem 1.5rem; max-width: 64rem;
  }
  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .4rem; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; }

  /* runs | datasets | sources -- always visible, regardless of which view
     or drill-down page is on screen, so jumping between top-level views
     never means going back to the dashboard first. Active view is bold,
     not a different color -- same "no separate palette for UI chrome"
     rule the rest of the page follows. */
  #viewNav { font-size: 12px; }
  #viewNav a { color: inherit; opacity: .55; text-decoration: none; }
  #viewNav a:hover { opacity: .85; }
  #viewNav a.active { opacity: 1; font-weight: 600; }
  #viewNav .nav-sep { opacity: .3; margin: 0 .3rem; }

  /* Leaves the SPA entirely (a redirect to the lab's own subdomain), so it
     sits outside #viewNav and takes no part in app.js's data-view
     route-highlighting. */
  #labLink { font-size: 12px; color: inherit; opacity: .55; text-decoration: none; }
  #labLink:hover { opacity: .85; }

  /* Per-run lab-icon link (runRow, web/render.js) -- same treatment as
     #labLink above, scoped as a class since it repeats once per run. */
  a.lab-run-link { font-size: 12px; color: inherit; opacity: .55; text-decoration: none; margin-left: 8px; }
  a.lab-run-link:hover { opacity: .85; }

  #conn { font-size: 11px; padding: .1rem .55rem; border: 1px solid; border-radius: 999px; white-space: nowrap; }
  .ok  { color: #1a7f37; border-color: #1a7f37; }
  .bad { color: #cf222e; border-color: #cf222e; }
  #meta { opacity: .55; font-size: 11px; margin-bottom: 1rem; min-height: 1.2em; }

  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th, td { padding: .2rem .7rem; text-align: left; border-top: 1px solid rgba(128,128,128,.18); }
  th { opacity: .55; font-weight: 600; font-size: 11px; border-top: none; }
  td.run { word-break: break-all; }
  td.call { word-break: break-all; opacity: .8; }
  .dim { opacity: .45; }

  /* One dot per artifact row -- see dot() in render.js for what puts an
     artifact into each bucket.
       done     : finished.
       running  : an active call is working on it right now.
       runnable : nothing blocking it, no call in progress -- can launch.
       blocked  : not done, not runnable (waiting on a dependency).
       failed   : a call held the lease and went stale before finishing, or
                  the manifest itself conflicts with what's declared. */
  .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 999px; vertical-align: middle; margin-right: .4rem; }
  .dot.done     { background: #1a7f37; }
  .dot.running  { background: #0969da; }
  .dot.runnable { background: #bf8700; }
  .dot.blocked  { background: rgba(128,128,128,.4); }
  .dot.failed   { background: #cf222e; }

  /* A run is a plain grouping label now -- everything that used to be on
     its own summary row (lease, call, heartbeat) is per-artifact, on the
     rows underneath. No bottom border of its own; the top border it does
     have separates it from the *previous* run's last artifact row. */
  tr.run-header td { font-weight: 600; opacity: .8; padding-top: .5rem; }
  /* Indent only the first (artifact/type) column -- padding-left on every
     td in the row would shove the call/heartbeat/run columns out of step
     with the header and with every other row's fixed column widths. The
     first column is widened in the colgroup below to give this room
     without wrapping; that width comes out of the flexible path column
     next to it, not out of the other fixed-width columns. */
  tr.artifact-row td:first-child {
    padding-left: 1.4rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* depth-1: nested one level under a type-group's summary row (or, in the
     `datasets` view, under a dataset's own row). depth-2: a dataset's own
     dependency rows nested inside a type-group nested under the dataset's
     row -- three levels deep in that one case, so this needs a tier
     typeGroupedRows' plain run case never reaches. */
  tr.artifact-row.depth-1 td:first-child { padding-left: 2.8rem; }
  tr.artifact-row.depth-2 td:first-child { padding-left: 4.2rem; }

  /* A type-group's summary row -- same indent level as an ungrouped
     artifact row at the same depth, since it stands in for one. Not bold
     and not dimmed -- it's a stand-in for a normal row, not a heading.
     Whole row is the click target (see groupHeaderRow in render.js), so
     it gets the pointer cursor, not just the arrow glyph. depth-1: a
     dataset's own dependency groups, nested under the dataset's row. */
  tr.group-header td { padding-left: 1.4rem; cursor: pointer; user-select: none; }
  tr.group-header.depth-1 td { padding-left: 2.8rem; }
  tr.group-header:hover { background: rgba(128,128,128,.06); }
  .group-arrow { display: inline-block; width: 1rem; opacity: .6; }

  .artifact-type, .group-type { font-size: 11px; }
  /* "(Mapped)" next to a MappedDataSet's type, in the `datasets` view --
     see render.js's artifactRow (state.mapped) and main.py's
     datasets_state. Dim like every other secondary label on the page, not
     a badge -- it's a note about the row, not a status. */
  .artifact-tag { opacity: .5; font-size: 11px; }
  /* Long paths truncate with an ellipsis instead of wrapping to a second
     line -- a wrapped row grows taller and throws off every row's
     vertical rhythm. Full path is still one hover away via the link's
     title attribute. */
  td.artifact-path {
    opacity: .7; font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* One button per row, offering the one thing worth doing to that artifact
     (render.js's actionButton): run it, or stop it. One shape and one slot
     for both -- only the color says which, matching the dot palette above:
     green for run, red for stop. */
  .launch-btn {
    width: 2.6rem; padding: .15rem 0;
    font: 9px/1 inherit; text-align: center;
    border: 1px solid; border-radius: 3px;
    background: transparent;
    cursor: pointer;
  }
  .launch-btn.run      { border-color: #1a7f37; color: #1a7f37; }
  .launch-btn.cancel   { border-color: #cf222e; color: #cf222e; }
  .launch-btn.run:hover:not(:disabled)      { background: rgba(26,127,55,.15); }
  .launch-btn.cancel:hover:not(:disabled)   { background: rgba(207,34,46,.15); }
  /* Nothing to do (already done): pale and frozen -- no color, no hover,
     no pointer. Still shown so its slot in the row doesn't shift once it
     does become launchable. */
  .launch-btn:disabled {
    border-color: rgba(128,128,128,.3); color: rgba(128,128,128,.5);
    cursor: default;
  }
  /* Just clicked, waiting on the next poll to land (render.js's
     actionButton, app.js's justClicked) -- same blue as the "running" dot
     elsewhere on the page, so it reads as "something's happening" rather
     than the plain gray every other disabled button gets. Comes after
     .launch-btn:disabled so it wins the tie on equal specificity. */
  .launch-btn.clicked:disabled {
    border-color: #0969da; color: #0969da;
  }

  .empty { opacity: .55; padding: 1rem 0; }

  details#problems { margin-top: 1.5rem; }
  details#problems summary {
    cursor: pointer; font-size: 11px; font-weight: 600; color: #cf222e;
  }
  details#problems table { margin-top: .6rem; table-layout: fixed; }
  details#problems td.run { width: 30%; }
  td.error { word-break: break-word; white-space: pre-wrap; opacity: .85; font-size: 11px; }

  a.artifact-link { color: inherit; text-decoration: none; }
  a.artifact-link:hover { text-decoration: underline; }

  /* --- one artifact's page --------------------------------------------- */
  #artifactView { font-size: 12px; }
  .view-back a { color: inherit; opacity: .6; text-decoration: none; }
  .view-back a:hover { opacity: 1; text-decoration: underline; }

  /* An artifact's drill-down page (see artifactview.js): type, own
     parameters, and links one level down to whatever it depends on. */
  .artifact-summary {
    border: 1px solid rgba(128,128,128,.18); border-radius: 6px;
    padding: .6rem .9rem; margin: .3rem 0 1rem;
  }
  .summary-type { font-weight: 600; font-size: 12px; margin-bottom: .3rem; }
  .summary-params { display: flex; flex-direction: column; gap: .1rem; }
  .summary-param { display: flex; gap: .5rem; font-size: 11px; }
  .summary-key { opacity: .55; min-width: 8rem; }
  .summary-value { word-break: break-word; }
  .summary-deps { font-size: 11px; opacity: .8; margin: .5rem 0 0; word-break: break-all; }
  .summary-deps a { color: inherit; }
  .summary-deps a:hover { text-decoration: underline; }

</style>
</head>
<body>

<header>
  <h1 id="title">runs</h1>
  <nav id="viewNav">
    <a href="#/runs" data-view="runs">runs</a>
    <span class="nav-sep">|</span>
    <a href="#/datasets" data-view="datasets">datasets</a>
    <span class="nav-sep">|</span>
    <a href="#/sources" data-view="sources">sources</a>
  </nav>
  <a id="labLink" href="/lab" target="_blank" rel="noopener">lab ↗</a>
  <span id="conn" class="bad">loading</span>
</header>
<div id="meta"></div>

<div id="dashboard">
<table>
  <colgroup>
    <col style="width: 13.5rem">
    <col>
    <col style="width: 7.5rem">
    <col style="width: 9rem">
    <col style="width: 9rem">
    <col style="width: 4rem">
  </colgroup>
  <thead>
    <tr><th>artifact</th><th>path</th><th>call</th><th>last heartbeat</th><th>progress</th><th></th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<p class="empty" id="empty" hidden></p>

<!-- Only a run whose preflight check itself raised lands here -- a normal
     run, even an empty or blocked one, never does. Hidden entirely when
     there are none; collapsed by default when there are, since these are
     the exception, not what a glance at the page is usually for. -->
<details id="problems" hidden>
  <summary>problem runs (<span id="problemCount">0</span>)</summary>
  <table>
    <thead>
      <tr><th>run</th><th>error</th></tr>
    </thead>
    <tbody id="problemRows"></tbody>
  </table>
</details>
</div>

<!-- One artifact's own page, routed to by #/artifact/<path> -- see app.js's
     route() and artifactview.js. Hidden and empty until a route into it
     fires; #dashboard above is hidden in exchange. -->
<div id="artifactView" hidden></div>

<!-- One entry point. type="module" gives us import/export with no bundler.
     Note: ES modules only load over http(s), not file:// — serve the folder
     (which your orchestrator already does, since the page fetches /state). -->
<script type="module" src="app.js"></script>

</body>
</html>
